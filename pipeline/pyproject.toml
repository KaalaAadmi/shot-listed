[project]
name = "shot-listed-pipeline"
version = "0.1.0"
description = "ShotListed's pipeline host: claims jobs from the web app and runs ffmpeg and model calls."
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1",
  "httpx>=0.27",
  "imagehash>=4.3",
  "pillow>=10",
  "pillow-heif>=0.18",
  "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
